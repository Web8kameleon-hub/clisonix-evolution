version: '3.8'
services:
  ljubljana-quantum-lab:
    build:
      context: ../
      dockerfile: Dockerfile.lab
    container_name: clisonix-lab-ljubljana-quantum
    environment:
      LAB_ID: "Ljubljana_Quantum"
      LAB_TYPE: "Quantum"
      LAB_NAME: "Ljubljana Quantum Lab"
      LAB_FUNCTION: "Quantum Computing & Physics"
      API_KEY: "sekret-real"
    ports:
      - "8116:8100"
    volumes:
      - ../data/ljubljana-quantum:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
