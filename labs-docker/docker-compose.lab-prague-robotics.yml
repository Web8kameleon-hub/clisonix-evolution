version: '3.8'
services:
  prague-robotics-lab:
    build:
      context: ../
      dockerfile: Dockerfile.lab
    container_name: clisonix-lab-prague-robotics
    environment:
      LAB_ID: "Prague_Robotics"
      LAB_TYPE: "Robotics"
      LAB_NAME: "Prague Robotics Lab"
      LAB_FUNCTION: "Robotics & Automation Systems"
      API_KEY: "sekret-real"
    ports:
      - "8118:8100"
    volumes:
      - ../data/prague-robotics:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
