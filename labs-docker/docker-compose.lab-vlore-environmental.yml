version: '3.8'
services:
  vlore-environmental-lab:
    build:
      context: ../
      dockerfile: Dockerfile.lab
    container_name: clisonix-lab-vlore-environmental
    environment:
      LAB_ID: "Vlore_Environmental"
      LAB_TYPE: "Environmental"
      LAB_NAME: "Vlorë Environmental Lab"
      LAB_FUNCTION: "Environmental Monitoring & Ecology"
      API_KEY: "sekret-real"
    ports:
      - "8105:8100"
    volumes:
      - ../data/vlore-environmental:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
