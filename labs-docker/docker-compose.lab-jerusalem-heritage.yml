version: '3.8'
services:
  jerusalem-heritage-lab:
    build:
      context: ../
      dockerfile: Dockerfile.lab
    container_name: clisonix-lab-jerusalem-heritage
    environment:
      LAB_ID: "Jerusalem_Heritage"
      LAB_TYPE: "Heritage"
      LAB_NAME: "Jerusalem Heritage Lab"
      LAB_FUNCTION: "Cultural Heritage & Restoration"
      API_KEY: "sekret-real"
    ports:
      - "8123:8100"
    volumes:
      - ../data/jerusalem-heritage:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
