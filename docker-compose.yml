    container_name: clisonix-orchestra
    ports:
    - 9700:9700
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-Web8kameleon-hub/clisonix.com}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_ZONE_ID: ${CF_ZONE_ID:-}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      ORCHESTRA_HETZNER_IP: ${ORCHESTRA_HETZNER_IP:-46.225.14.83}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CLISONIX_API_URL: ${CLISONIX_API_URL:-http://api:8000}
      CLISONIX_INTERNAL_KEY: ${CLISONIX_INTERNAL_KEY:-}
      GIT_EXPECTED_ORG: Web8kameleon-hub
      GIT_REPO_PATH: /app
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ORCHESTRA_TIMEOUT_S: '15'
