services:
  postgres:
    image: postgres:16-alpine
    container_name: clisonix-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clisonix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-clisonixdb}
    ports:
    - 127.0.0.1:5432:5432
    volumes:
    - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-clisonix} -d ${POSTGRES_DB:-clisonixdb}
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
  mongodb:
    image: mongo:7
    container_name: clisonix-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-clisonix}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-starbooking}
    ports:
    - 127.0.0.1:27017:27017
    volumes:
    - ./data/mongodb:/data/db
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - --eval
      - db.adminCommand('ping').ok
      interval: 15s
      timeout: 10s
      retries: 8
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
  redis:
    image: redis:7-alpine
    container_name: clisonix-redis
    ports:
    - 127.0.0.1:6379:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
  neo4j:
    image: neo4j:5-community
    container_name: clisonix-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
    - 127.0.0.1:7474:7474
    - 127.0.0.1:7687:7687
    volumes:
    - ./data/neo4j:/data
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://localhost:7474 || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
  minio:
    image: minio/minio:latest
    container_name: clisonix-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clisonix}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: server /data --console-address ":9001"
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    volumes:
    - ./data/minio:/data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
  alba:
    build:
      context: .
      dockerfile: Dockerfile.alba
    container_name: clisonix-alba
    environment:
      PYTHONUNBUFFERED: '1'
      REDIS_URL: redis://redis:6379/0
    ports:
    - 5555:5555
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:5555/health >/dev/null && python -c "import socket;
        s=socket.create_connection(('redis',6379),2); s.close()"
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.75'
          memory: 512M
  albi:
    build:
      context: .
      dockerfile: Dockerfile.albi
    container_name: clisonix-albi
    environment:
      PYTHONUNBUFFERED: '1'
      REDIS_URL: redis://redis:6379/0
      PORT: '6680'
    ports:
    - 6680:6680
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:6680/health >/dev/null && python -c "import socket;
        s=socket.create_connection(('redis',6379),2); s.close()"
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.75'
          memory: 512M
  albi-user:
    build:
      context: .
      dockerfile: Dockerfile.albi-user
    container_name: clisonix-albi-user
    environment:
      PYTHONUNBUFFERED: '1'
    ports:
    - 6681:6681
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:6681/health
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.75'
          memory: 512M
  jona:
    build:
      context: .
      dockerfile: Dockerfile.jona
    container_name: clisonix-jona
    command: 'sh -c "python -m uvicorn jona_neural_api:app --host 0.0.0.0 --port 7777"

      '
    environment:
      PYTHONUNBUFFERED: '1'
      REDIS_URL: redis://redis:6379/0
      PORT: '7777'
    ports:
    - 7777:7777
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:7777/health >/dev/null && python -c "import socket;
        s=socket.create_connection(('redis',6379),2); s.close()"
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.75'
          memory: 512M
  ollama:
    image: ollama/ollama:latest
    container_name: clisonix-ollama
    ports:
    - 11434:11434
    volumes:
    - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
    healthcheck:
      test:
      - CMD-SHELL
      - ollama list || exit 0
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.75'
          memory: 512M
  ollama-multi-api:
    build:
      context: .
      dockerfile: Dockerfile.ollama-multi
    container_name: clisonix-ollama-multi-api
    environment:
      PYTHONUNBUFFERED: '1'
      OLLAMA_HOST: http://clisonix-ollama:11434
      PORT: '4444'
    ports:
    - 4444:4444
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:4444/health
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.75'
          memory: 512M
  clx-agent:
    build:
      context: .
      dockerfile: Dockerfile.clx-agent
    container_name: clisonix-clx-agent
    ports:
      - "7778:7778"
    volumes:
      - clx_memory:/data/.clx
    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "7778"
      CLX_MEMORY_DIR: /data/.clx
      CLX_DEFAULT_LANGUAGE: en
      CLX_AUTO_LEARN: "true"
      CLX_LEARN_DURATION: "14400"
      CLX_LEARN_INTERVAL: "60"
      CLX_MEMORY_PATH: /data/.clx/training-memory.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7778/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  ocean-core:
    build:
      context: ./ocean-core
      dockerfile: Dockerfile
    container_name: clisonix-ocean-core
    networks:
      default:
        aliases:
        - ocean-core
    environment:
      PYTHONUNBUFFERED: '1'
      OCEAN_PORT: '8030'
      CLX_AGENT_URL: http://clisonix-clx-agent:7778
      MODEL: clx-core
      OCEAN_AUTOLEARNING_ENABLED: 'true'
      OCEAN_LLM_PROVIDER_ORDER: openai_compat,selflearning
      OPENAI_COMPAT_BASE: http://clisonix-kloud-bridge:8889
      OPENAI_COMPAT_MODEL: llama3.1:8b
      OCEAN_SOVEREIGN_SELFREGEN_ENABLED: 'true'
      OCEAN_SELFREGEN_REBUILD_MAX_LINES: '2000'
      CHAT_ELASTIC_NO_LIMITS: 'true'
      CHAT_MAX_TOKENS_HARD: '0'
      CHAT_RATE_LIMIT_REQUESTS: '999999'
      CHAT_MAX_PROMPT_CHARS: '0'
      OCEAN_FAST_ANSWER_TIMEOUT_S: '15'
      OCEAN_FAST_SHORTCUT_MAX_CHARS: '0'
      OCEAN_FAST_TARGET_CHARS_SHORT: '420'
      OCEAN_FAST_TARGET_CHARS_MEDIUM: '900'
      DEBATE_MAX_TOKENS_HARD: '-1'
      DEBATE_STREAM_MAX_CONCURRENCY: '12'
      DEBATE_STREAM_QUEUE_LIMIT: '64'
      DEBATE_RATE_LIMIT_REQUESTS: '999999'
      REDIS_URL: redis://redis:6379/0
      API_KEYS_FILE: /app/config/api_keys.json
      CLISONIX_SYSTEM_PROMPT_PATH: /app/CLISONIX_SYSTEM_PROMPT.md
      CLISONIX_MODULE_MAP_PATH: /app/CLISONIX_MODULE_MAP.md
      KLOUD_BRIDGE_URL: http://clisonix-kloud-bridge:8889
    volumes:
    - ./config/api_keys.json:/app/config/api_keys.json:ro
    - ./CLISONIX_SYSTEM_PROMPT.md:/app/CLISONIX_SYSTEM_PROMPT.md:ro
    - ./CLISONIX_MODULE_MAP.md:/app/CLISONIX_MODULE_MAP.md:ro
    - ./ocean-data:/app/data
    ports:
    - 8030:8030
    depends_on:
      clx-agent:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8030/health
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 512M
  ocean-mission-service:
    build:
      context: .
      dockerfile: ocean-core/Dockerfile.mission
    container_name: clisonix-ocean-mission
    environment:
      PYTHONUNBUFFERED: '1'
      PORT: '9500'
      MISSION_DB_PATH: /app/data/ocean_missions.db
      PYTHON_BIN: python
    volumes:
    - ./data:/app/data
    ports:
    - 9500:9500
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9500/health
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 512M
  kloud-upstream-runtime:
    build:
      context: .
      dockerfile: services/kloud_upstream_runtime/Dockerfile
    container_name: clisonix-kloud-upstream-runtime
    environment:
      PYTHONUNBUFFERED: '1'
      PORT: '9080'
      KLOUD_RUNTIME_NODE_ID: ${KLOUD_RUNTIME_NODE_ID:-aiagi-node-01}
      KLOUD_RUNTIME_ROLE: ${KLOUD_RUNTIME_ROLE:-coordinator}
      KLOUD_RUNTIME_REGION: ${KLOUD_RUNTIME_REGION:-eu-central}
      KLOUD_RUNTIME_PUBLIC_BASE_URL: ${KLOUD_RUNTIME_PUBLIC_BASE_URL:-https://aiagi.io}
      KLOUD_RUNTIME_STATE_PATH: /app/data/runtime-state.json
    volumes:
    - ./data/kloud-upstream-runtime:/app/data
    ports:
    - 9080:9080
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9080/health
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 512M
  kloud-bridge:
    build:
      context: .
      dockerfile: services/kloud_bridge/Dockerfile
    container_name: clisonix-kloud-bridge
    environment:
      PYTHONUNBUFFERED: '1'
      PORT: '8889'
      KLOUD_ISOLATED_MODE: 'true'
      KLOUD_UPSTREAM_URL: ${KLOUD_UPSTREAM_URL:-http://kloud-upstream-runtime:9080}
      KLOUD_UPSTREAM_CANDIDATES: ${KLOUD_UPSTREAM_CANDIDATES:-http://kloud-upstream-runtime:9080,https://aiagi.io,http://host.docker.internal:9080,http://host.containers.internal:9080,http://gateway.docker.internal:9080,http://172.17.0.1:9080,http://172.18.0.1:9080,http://127.0.0.1:9080}
      KLOUD_SIGNAL_PATH: ${KLOUD_SIGNAL_PATH:-/submit}
      KLOUD_STATUS_PATH: ${KLOUD_STATUS_PATH:-/status}
      KLOUD_PEERS_PATH: ${KLOUD_PEERS_PATH:-/peers}
      KLOUD_STATE_PATH: ${KLOUD_STATE_PATH:-/state}
      KLOUD_TIMEOUT_SECONDS: ${KLOUD_TIMEOUT_SECONDS:-8}
      KLOUD_LLM_UPSTREAM_URL: ${KLOUD_LLM_UPSTREAM_URL:-http://clisonix-openmind:9999}
      KLOUD_LLM_CHAT_PATH: ${KLOUD_LLM_CHAT_PATH:-/api/v1/chat}
      KLOUD_LLM_TIMEOUT_SECONDS: ${KLOUD_LLM_TIMEOUT_SECONDS:-30}
      KLOUD_LLM_STREAM_CHUNK_CHARS: ${KLOUD_LLM_STREAM_CHUNK_CHARS:-48}
      KLOUD_BRIDGE_ADMIN_TOKEN: ${KLOUD_BRIDGE_ADMIN_TOKEN:-}
      OCEAN_ADMIN_API_TOKEN: ${OCEAN_ADMIN_API_TOKEN:-}
      OCEAN_CORE_URL: http://clisonix-ocean-core:8030
      OCEAN_STATUS_PATH: /api/v1/status
      OCEAN_SIGNAL_PATH: /api/v1/signals/internal
    depends_on:
      kloud-upstream-runtime:
        condition: service_started
    extra_hosts:
    - host.docker.internal:host-gateway
    - host.containers.internal:host-gateway
    - gateway.docker.internal:host-gateway
    ports:
    - 8889:8889
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8889/health
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 512M
  kloud-rust-node:
    build:
      context: ./scripts/hardware/rust_node_agent
      dockerfile: Dockerfile
    container_name: clisonix-kloud-rust-node
    depends_on:
      kloud-bridge:
        condition: service_started
    command:
    - --bridge
    - http://clisonix-kloud-bridge:8889
    - --profile
    - /app/profiles/oceancore_live_01.json
    - --forever
    - --interval
    - '300'
    - --wake-offline
    - --emit-signal
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://clisonix-kloud-bridge:8889/api/v1/hardware/nodes/oceancore-live-01
        | grep -Eq '"runtime_state"[[:space:]]*:[[:space:]]*"offline"' && exit 1 ||
        exit 0
      interval: 5m
      timeout: 15s
      retries: 2
      start_period: 90s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 512M
  regulatory-service:
    build:
      context: ./services/regulatory
      dockerfile: Dockerfile
    container_name: clisonix-regulatory
    environment:
      PYTHONUNBUFFERED: '1'
      PORT: '9501'
      REGULATORY_JURISDICTION: EU
      REGULATORY_DATA_REGION: EU
      REGULATORY_PROFILE: wellness-v1
      CERTIFIED_MODEL_VERSION: clisonix-default:certified
      BASELINE_SUCCESS_RATE: '0.95'
      BASELINE_RETRY_RATE: '0.05'
      DRIFT_WARNING_THRESHOLD: '0.05'
      DRIFT_CRITICAL_THRESHOLD: '0.10'
      FEDERATED_TARGETS: EU
    volumes:
    - ./data:/app/data
    ports:
    - 9501:9501
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:9501/health',
        timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 512M
  ocean-core-multimodal:
    build:
      context: ./ocean-core
      dockerfile: Dockerfile.multimodal
    container_name: clisonix-ocean-core-multimodal
    environment:
      PYTHONUNBUFFERED: '1'
      OCEAN_PORT: '8033'
      PORT: '8033'
      OLLAMA_HOST: http://clisonix-ollama:11434
    ports:
    - 8033:8033
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8033/health
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 512M
  ocean-core-strict-chat:
    build:
      context: ./ocean-core
      dockerfile: Dockerfile.strict-chat
    container_name: clisonix-ocean-core-strict-chat
    environment:
      PYTHONUNBUFFERED: '1'
      OCEAN_PORT: '8035'
      OLLAMA_HOST: http://clisonix-ollama:11434
    ports:
    - 8035:8035
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8035/health
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 512M
  ocean-core-blerina:
    build:
      context: ./ocean-core
      dockerfile: Dockerfile.blerina
    container_name: clisonix-ocean-core-blerina
    environment:
      PYTHONUNBUFFERED: '1'
      OCEAN_PORT: '8032'
      OLLAMA_HOST: http://clisonix-ollama:11434
    ports:
    - 8032:8032
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8032/health
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 512M
  aviation:
    build:
      context: ./services/aviation-weather
      dockerfile: Dockerfile
    container_name: clisonix-aviation
    environment:
      PYTHONUNBUFFERED: '1'
      AVIATION_PORT: '8080'
      AVWX_API_KEY: ${AVWX_API_KEY:-}
      CHECKWX_API_KEY: ${CHECKWX_API_KEY:-}
    ports:
    - 8080:8080
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: clisonix-api
    networks:
      default:
        aliases:
        - api
    env_file:
    - ${CLISONIX_ENV_FILE:-.env.production}
    environment:
      PYTHONUNBUFFERED: '1'
      API_PORT: '8000'
      REPORTING_SERVICE_URL: http://reporting:8001
      JONA_API_URL: http://jona:7777
      DATABASE_URL: postgresql://${POSTGRES_USER:-clisonix}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD
        is required}@postgres:5432/${POSTGRES_DB:-clisonixdb}
      REDIS_URL: redis://redis:6379/0
      MARKETPLACE_URL: http://clisonix-marketplace:8004
    ports:
    - 8000:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jona:
        condition: service_healthy
      reporting:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8000/health >/dev/null && python -c "import socket;
        socket.create_connection(('postgres',5432),2).close(); socket.create_connection(('redis',6379),2).close();
        socket.create_connection(('jona',7777),2).close()"
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 512M
  matia:
    build:
      context: .
      dockerfile: Dockerfile.matia
    container_name: clisonix-matia
    environment:
      PYTHONUNBUFFERED: '1'
      PORT: '7200'
    ports:
    - 7200:7200
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:7200/health
      interval: 30s
      timeout: 10s
