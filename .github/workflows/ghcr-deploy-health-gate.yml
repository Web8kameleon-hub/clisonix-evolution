name: GHCR Deploy Health Gate (No SSH)

on:
  workflow_run:
    workflows: ["GHCR Build Push (No SSH)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      web_health_url:
        description: Public web health URL
        required: false
        default: https://www.clisonix.com/api/health-check
        type: string
      api_health_url:
        description: Public API health URL
        required: false
        default: https://api.clisonix.com/health
        type: string
      ocean_health_url:
        description: Public ocean health URL
        required: false
        default: https://api.clisonix.com/ocean/health
        type: string

permissions:
  contents: read
  actions: read

env:
  WEB_HEALTH_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.web_health_url || 'https://www.clisonix.com/api/health-check' }}
  API_HEALTH_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.api_health_url || 'https://api.clisonix.com/health' }}
  OCEAN_HEALTH_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.ocean_health_url || 'https://api.clisonix.com/ocean/health' }}

jobs:
  health-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Select tested build
        id: build
        uses: actions/github-script@v7
        with:
          script: |
            let run = context.payload.workflow_run;
            if (!run) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner, repo: context.repo.repo,
                workflow_id: 'ghcr-build-push.yml', branch: 'main', status: 'success', per_page: 1
              });
              run = response.data.workflow_runs[0];
            }
            if (!run || run.conclusion !== 'success') throw new Error('A successful build is required');
            core.setOutput('run_id', String(run.id));
            core.setOutput('revision', run.head_sha);

      - name: Download complete tested API contract
        uses: actions/download-artifact@v4
        with:
          name: tested-api-contract
          path: tested-api-contract
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.build.outputs.run_id }}

      - name: Validate required URLs
        run: |
          set -euo pipefail
          if [ -z "${WEB_HEALTH_URL}" ] || [ -z "${API_HEALTH_URL}" ] || [ -z "${OCEAN_HEALTH_URL}" ]; then
            echo "::error::Missing health URLs"
            exit 1
          fi

      - name: Check endpoints
        run: |
          set -euo pipefail

          check_url() {
            name="$1"
            url="$2"
            ok=0
            for i in $(seq 1 25); do
              code=$(curl -L -sS --connect-timeout 10 --max-time 20 -o /dev/null -w "%{http_code}" "$url" || true)
              if [ "$code" = "200" ]; then
                ok=1
                break
              fi
              sleep 3
            done

            if [ "$ok" -ne 1 ]; then
              echo "::error::$name failed health check: $url"
              return 1
            fi
            echo "$name healthy: $url"
          }

          check_url "web" "${WEB_HEALTH_URL}"
          check_url "api" "${API_HEALTH_URL}"
          check_url "ocean-core" "${OCEAN_HEALTH_URL}"


      - name: Verify deployed API contract
        env:
          EXPECTED_REVISION: ${{ steps.build.outputs.revision }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["API_HEALTH_URL"].removesuffix("/health").rstrip("/")
          from pathlib import Path
          expected = json.loads(Path("tested-api-contract/openapi.json").read_text())
          revision = Path("tested-api-contract/revision.txt").read_text().strip()
          if revision != os.environ["EXPECTED_REVISION"]:
              raise SystemExit("Route contract revision does not match the selected release")
          verbs = {"get", "post", "put", "patch", "delete", "head", "options", "trace"}
          def operations(spec):
              return {(method.upper(), path) for path, methods in spec["paths"].items()
                      for method in methods if method.lower() in verbs}
          required = operations(expected)
          if len(expected["paths"]) < 245:
              raise SystemExit("Tested API has fewer than the required 245 route paths")
          print(f"Checking all {len(expected['paths'])} paths and {len(required)} HTTP operations.")
          last_error = ""
          for attempt in range(30):
              try:
                  request = urllib.request.Request(base + "/openapi.json",
                                                   headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      document = json.load(response)
                  actual = operations(document)
                  missing = sorted(required - actual)
                  extra = sorted(actual - required)
                  if missing or extra:
                      raise RuntimeError(f"Route contract differs: missing={missing}, extra={extra}")
                  try:
                      urllib.request.urlopen(base + "/neural-symphony", timeout=15)
                      raise RuntimeError("Synthetic endpoint retirement is not active")
                  except urllib.error.HTTPError as error:
                      if error.code != 410:
                          raise RuntimeError(f"Expected HTTP 410, received {error.code}") from error
                  print("Deployed API contract matches required release behavior.")
                  break
              except Exception as error:
                  last_error = str(error)
                  if attempt == 29:
                      raise SystemExit("Deployment contract verification failed: " + last_error)
                  time.sleep(5)
          PY

      - name: Summary
        run: |
          echo "## Deploy Health Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: success" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web URL: ${WEB_HEALTH_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- API URL: ${API_HEALTH_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ocean URL: ${OCEAN_HEALTH_URL}" >> "$GITHUB_STEP_SUMMARY"
