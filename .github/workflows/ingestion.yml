name: ingestion-ci

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * *'

jobs:
  validate-dags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate DAG Python syntax
        run: python -m compileall -q airflow/dags
