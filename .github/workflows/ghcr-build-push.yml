name: GHCR Build Push (No SSH)

on:
  push:
    branches: [main]
    paths:
      - tests/unit/test_runtime_route_compatibility.py
      - tests/unit/test_stripe_webhook.py
      - tests/unit/test_database_configuration.py
      - services/user-management/**
      - java-longo/**
      - apps/api/**
      - ai_model_versioning.py
      - model_governance.py
      - reviewer_identity_registry.py
      - routes/alba_routes.py
      - apps/web/**
      - ocean_core/**
      - .github/workflows/ghcr-build-push.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-build-push-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  smoke-build:
    name: Build + Smoke (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
            image: clisonix-evolution-api
            context: .
            dockerfile: ./apps/api/Dockerfile
            host_port: 18000
            container_port: 8000
            health_path: /health
          - name: web
            image: clisonix-evolution-web
            context: ./apps/web
            dockerfile: ./apps/web/Dockerfile
            host_port: 13000
            container_port: 3000
            health_path: /api/health-check
          - name: user-management
            image: clisonix-evolution-user-management
            context: ./services/user-management
            dockerfile: ./services/user-management/Dockerfile
            host_port: 18070
            container_port: 8070
            health_path: /health
          - name: ocean-core
            image: clisonix-evolution-ocean-core
            context: ./ocean_core
            dockerfile: ./ocean_core/Dockerfile
            host_port: 18030
            container_port: 8030
            health_path: /health

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set image owner
        id: owner
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local test image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          load: true
          tags: local/${{ matrix.service.image }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_placeholder
            NEXT_PUBLIC_API_BASE=/api
            NEXT_PUBLIC_GOOGLE_ADSENSE_ID=
            AUTH_SECRET=health-gate-auth-secret
            NEXTAUTH_SECRET=health-gate-nextauth-secret

      - name: Start test container
        run: |
          set -euo pipefail
          docker run -d \
            --name smoke-${{ matrix.service.name }} \
            -p ${{ matrix.service.host_port }}:${{ matrix.service.container_port }} \
            -e PORT=${{ matrix.service.container_port }} \
            -e NEXTAUTH_SECRET=health-gate-nextauth-secret \
            -e AUTH_SECRET=health-gate-auth-secret \
            local/${{ matrix.service.image }}:${{ github.sha }}

      - name: Wait for health endpoint
        run: |
          set -euo pipefail
          URL="http://127.0.0.1:${{ matrix.service.host_port }}${{ matrix.service.health_path }}"
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            sleep 2
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::Health check failed for $URL"
            docker logs smoke-${{ matrix.service.name }} || true
            exit 1
          fi

      - name: Verify API route compatibility
        if: matrix.service.name == 'api'
        run: |
          docker run --rm --entrypoint sh \
            -e PYTHONPATH=/app:/app/apps/api \
            -v "${{ github.workspace }}/tests/unit:/tests:ro" \
            local/${{ matrix.service.image }}:${{ github.sha }} \
            -c 'python -m pip install "pytest>=8.3,<10" && python -m pytest -q /tests/test_runtime_route_compatibility.py /tests/test_stripe_webhook.py /tests/test_database_configuration.py'


      - name: Verify persistent auth and billing
        if: matrix.service.name == 'user-management'
        run: |
          docker run --rm --entrypoint sh \
            local/${{ matrix.service.image }}:${{ github.sha }} \
            -c 'python -m pip install "pytest>=8.3,<10" && python -m pytest -q tests'

      - name: Capture complete API route contract
        if: matrix.service.name == 'api'
        run: |
          mkdir -p "${RUNNER_TEMP}/api-contract"
          curl --fail --silent --show-error http://127.0.0.1:18000/openapi.json -o "${RUNNER_TEMP}/api-contract/openapi.json"
          printf '%s\n' '${{ github.sha }}' > "${RUNNER_TEMP}/api-contract/revision.txt"

      - name: Upload complete API route contract
        if: matrix.service.name == 'api'
        uses: actions/upload-artifact@v4
        with:
          name: tested-api-contract
          path: ${{ runner.temp }}/api-contract/
          if-no-files-found: error

      - name: Cleanup smoke container
        if: always()
        run: |
          docker rm -f smoke-${{ matrix.service.name }} >/dev/null 2>&1 || true

  push-images:
    name: Push Images (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    needs: smoke-build
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
            image: clisonix-evolution-api
            context: .
            dockerfile: ./apps/api/Dockerfile
          - name: web
            image: clisonix-evolution-web
            context: ./apps/web
            dockerfile: ./apps/web/Dockerfile
          - name: user-management
            image: clisonix-evolution-user-management
            context: ./services/user-management
            dockerfile: ./services/user-management/Dockerfile
          - name: ocean-core
            image: clisonix-evolution-ocean-core
            context: ./ocean_core
            dockerfile: ./ocean_core/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set image owner
        id: owner
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ matrix.service.image }}
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_placeholder
            NEXT_PUBLIC_API_BASE=/api
            NEXT_PUBLIC_GOOGLE_ADSENSE_ID=
            AUTH_SECRET=ghcr-build-auth-secret
            NEXTAUTH_SECRET=ghcr-build-nextauth-secret

      - name: Summary
        run: |
          echo "## GHCR image published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: ${{ matrix.service.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ${{ env.REGISTRY }}/${{ steps.owner.outputs.owner }}/${{ matrix.service.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
