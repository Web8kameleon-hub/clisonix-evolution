    direction: gateway_to_browser
    current_contract: "text/event-stream with status, data, error, and done frames."
    stability: frozen
    target_contract:
      headers: "text/event-stream; no-cache; X-Accel-Buffering=no"
      event_fields: [execution_id, sequence, type, stage, timestamp, data, error]
      terminal_types: [completed, failed, cancelled]
      rule: "No fabricated data frame; upstream failure emits failed with the real HTTP/error code."
