    units: [web_service_discovery]
    protocol: http_json
    direction: browser_to_registry_gateway
    current_contract: "GET returns services/summary/topology; POST accepts capability."
    stability: replace
    target_contract:
      request: "GET /api/actions/capabilities or GET /api/actions/capabilities/{id}"
