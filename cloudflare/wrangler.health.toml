# Cloudflare Worker — Clisonix Edge Health Monitor (isolated config)
# ==================================================================
# This file is intentionally NOT named wrangler.toml.
# It must be invoked explicitly so repository-level Cloudflare Git integration
# cannot auto-detect this health monitor as the default project gateway.
#
# Deploy:      npx wrangler deploy --config wrangler.health.toml
# Test local:  npx wrangler dev --config wrangler.health.toml

name        = "clisonix-health-worker"
main        = "health_worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/5 * * * *"]

[ai]
binding = "AI"

[vars]
TEAM_DOMAIN = "https://clisonix-com-pages.cloudflareaccess.com"
POLICY_AUD  = "ce5b2e959a1c6659b8558714ec426be76ec3ba8f6b51a9a0b5fbc3f6e1ba00ae"

# Secrets are configured separately in Cloudflare:
# SLACK_WEBHOOK_URL
# HETZNER_IP
