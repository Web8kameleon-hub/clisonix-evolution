services:
  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    depends_on:
      - api
      - reporting
  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    environment:
      - API_PORT=8000
    depends_on:
      - postgres
  reporting:
    build:
      context: .
      dockerfile: Dockerfile.reporting
    ports:
      - "8001:8001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: clisonixdb
      POSTGRES_USER: clisonix
      POSTGRES_PASSWORD: clisonix_dev_password
