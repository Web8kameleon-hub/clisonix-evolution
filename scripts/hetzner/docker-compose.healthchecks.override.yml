services:
  alba:
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:5555/health\", timeout=3)' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  asi:
